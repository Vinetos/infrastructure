# Adapte "name"/"namespace"/"sectionName" au Gateway que tu as déjà déclaré
# dans infrastructure/configs/gateway.yaml de ton repo.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: affine
  namespace: affine
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "affine.vinetos.fr"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: affine
          port: 3010
