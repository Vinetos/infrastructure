apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine
  namespace: affine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: affine
  template:
    metadata:
      labels:
        app: affine
    spec:
      containers:
        - name: affine
          image: ghcr.io/toeverything/affine:stable
          ports:
            - containerPort: 3010
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: affine-secrets
                  key: database-url
            - name: REDIS_SERVER_HOST
              value: affine-redis.affine.svc.cluster.local
            - name: AFFINE_SERVER_EXTERNAL_URL
              value: "https://affine.vinetos.fr"
            - name: AFFINE_SERVER_HTTPS
              value: "true"
            # Indexer nécessite plus de ressources ; laisse à "false" si tu
            # veux rester léger, passe à "true" plus tard si besoin.
            - name: AFFINE_INDEXER_ENABLED
              value: "false"
          volumeMounts:
            - name: storage
              mountPath: /root/.affine/storage
          readinessProbe:
            httpGet:
              path: /
              port: 3010
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: affine-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-storage
  namespace: affine
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
