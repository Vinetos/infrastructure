apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  # Doit rester dans envoy-gateway-system : le listener HTTPS du Gateway
  # référence le secret sans namespace (résolution même namespace).
  name: affine-vinetos-fr
  namespace: envoy-gateway-system
spec:
  secretName: affine-vinetos-fr-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - affine.vinetos.fr
